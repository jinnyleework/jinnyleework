name: Combined contribution graph

on:
  schedule:
    - cron: "17 5 * * *"  # daily
  workflow_dispatch:
  push:
    paths:
      - data/work-contributions.json
      - scripts/combine.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build graph
        run: python3 scripts/combine.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          PERSONAL_LOGIN: ${{ vars.PERSONAL_LOGIN || github.repository_owner }}
          WORK_LOGIN: ${{ vars.WORK_LOGIN }}

      - name: Commit graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined-graph-light.svg combined-graph-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update combined contribution graph"
            git push
          fi
